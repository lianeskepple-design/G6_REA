[package]
name = "aurora-audio-command"
default-run = "aurora-audio-command"
version = "1.0.0"
edition = "2021"
description = "A desktop audio control panel inspired by Sound Blaster Command"

[dependencies]
eframe = "=0.29.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "=3.5.1"
cpal = "0.15.3"
rtrb = "0.3.6"

[build-dependencies]
cc = "1.11"

[lib]
name = "aurora_audio_command"
path = "src/lib.rs"

[[bin]]
name = "sbc-eq"
path = "src/bin/sbc-eq.rs"

[[bin]]
name = "sbc-dsp"
path = "src/bin/sbc-dsp.rs"

[[bin]]
name = "sbc-live"
path = "src/bin/sbc-live.rs"

[profile.release]
opt-level = 2
lto = "thin"
